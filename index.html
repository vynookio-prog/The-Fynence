<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Fynence: AI Trading Journal &amp; Psychology Intelligence</title>
    <meta name="description" content="A vintage-inspired financial journal and trading terminal built for disciplined operators." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />

    <!-- Font CSS Variable Declarations -->
    <style>
      :root {
        --font-playfair: 'Playfair Display', Georgia, serif;
        --font-dm-mono: 'DM Mono', monospace;
      }
    </style>

    <!-- Synchronous anti-flash theme script -->
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('fynence_theme');
          var resolved = 'dark'; // Default dark for luxury terminal aesthetic
          if (pref === 'light') {
            resolved = 'light';
          } else if (pref === 'dark') {
            resolved = 'dark';
          } else if (pref === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen flex flex-col bg-[var(--color-paper)] text-[var(--color-ink)] font-sans retro-texture w-full max-w-full overflow-x-hidden selection:bg-[#00F2C2]/20 selection:text-[#00F2C2]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
